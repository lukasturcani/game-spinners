[workspace]
resolver = "2"
members = [
  "crates/*",
  "py-game-spinners",
]
default-members = [
  "crates/*",
]

[workspace.package]
version = "0.1.0"
authors = ["Lukas Turcani <lukasturcani93@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/lukasturcani/game-spinners"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
bevy = "0.15.3"
bevy_prototype_lyon = "0.13.0"
